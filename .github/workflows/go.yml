name: Проверки Go

on:
  pull_request:
    types: [closed]
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: gost-restreamer-version-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  check:
    name: Go и сборка для Debian 13
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    container:
      image: golang:1.27.3-trixie
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      GOWORK: "off"
      GOFLAGS: -mod=readonly
      GOOS: linux
      GOARCH: amd64
    steps:
      - name: Получение исходников
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Версия v7.0.1.
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Настройка доверенного каталога Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Планирование версии merge-коммита
        id: plan
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git for-each-ref --format='%(objectname)%09%(refname)' refs/tags > "$RUNNER_TEMP/release-tags.local"
          LC_ALL=C sort "$RUNNER_TEMP/release-tags.local" > "$RUNNER_TEMP/release-tags.before"
          go run ./tools/releaseplan -branch "$RELEASE_BRANCH" -commit "$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Вычисление нового тега
        if: steps.plan.outputs.reuse != 'true'
        id: tagger
        uses: GregoryGost/version-tagger@f7cd9b22c2acac8d07d416aee07593be502dcae5 # Версия v1.2.0.
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 0.1.0
          uselasttag: ${{ steps.plan.outputs.use_last_tag }}
          prefix: v
          postfix: ${{ steps.plan.outputs.postfix }}
          postfixnoup: false
          metadata: ${{ steps.plan.outputs.metadata }}
          releasetype: ${{ steps.plan.outputs.release_type }}
          auto: false
          dryrun: true

      - name: Проверка выделенной версии
        id: version
        env:
          EXPECTED_VERSION: ${{ steps.plan.outputs.version }}
          GENERATED_VERSION: ${{ steps.tagger.outputs.newtag }}
          REUSE: ${{ steps.plan.outputs.reuse }}
        run: |
          if [ "$REUSE" != true ] && [ "$EXPECTED_VERSION" != "$GENERATED_VERSION" ]; then
            echo 'Вычисленная версия не совпала с планом; выпуск остановлен.' >&2
            exit 1
          fi
          deb_version="$(printf '%s' "$EXPECTED_VERSION" | sed 's/^v//; s/-dev\./~dev./')"
          printf 'deb_version=%s\n' "$deb_version" >> "$GITHUB_OUTPUT"
          printf 'Версия обоих бинарников: %s\n' "$EXPECTED_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Установка инструментов проекта
        run: make tools

      - name: Проверка основы проекта
        run: make bootstrap-check

      - name: Определение доступных Go-пакетов
        id: source
        run: |
          packages="$(go list ./...)"
          if [ -n "$packages" ]; then
            echo 'packages=true' >> "$GITHUB_OUTPUT"
          else
            echo 'packages=false' >> "$GITHUB_OUTPUT"
            echo 'Go-пакетов пока нет: vet, lint, тесты и сборка не выполнялись.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f cmd/gost-restreamer/main.go ]; then
            echo 'binary=true' >> "$GITHUB_OUTPUT"
          else
            echo 'binary=false' >> "$GITHUB_OUTPUT"
            echo 'Точки входа сервиса пока нет: бинарник и архив не создавались.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Анализ, тесты и сборка пакетов
        if: steps.source.outputs.packages == 'true'
        run: make vet lint coverage test-race build

      - name: Сохранение диагностики упавших тестов
        if: failure() && steps.source.outputs.packages == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # Версия v7.0.2.
        with:
          name: gost-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/gost-session-failure-*/diagnostics.log
          if-no-files-found: warn
          retention-days: 7

      - name: Установка GoReleaser Community
        if: steps.source.outputs.binary == 'true'
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # Версия v6.
        with:
          distribution: goreleaser
          version: v2.19.0
          install-only: true

      - name: Проверка конфигураций и повторных выпусков
        if: steps.source.outputs.binary == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # Версия v8.0.0.
        with:
          script: |
            const { spawnSync } = require('node:child_process');
            const result = spawnSync('make', ['release-check', `NODE=${process.execPath}`], { stdio: 'inherit' });
            if (result.status !== 0) throw new Error('Проверки выпуска завершились ошибкой.');

      - name: Подготовка локального тега сборки
        if: steps.source.outputs.binary == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REUSE: ${{ steps.plan.outputs.reuse }}
        run: |
          if [ "$REUSE" != true ]; then
            git tag "$VERSION" "$MERGE_SHA"
          fi
          test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$MERGE_SHA"

      - name: Сборка и проверка установочных пакетов
        if: steps.source.outputs.binary == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          DEB_VERSION: ${{ steps.version.outputs.deb_version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          make package-debian VERSION="$VERSION"
          sh .github/scripts/verify-packages.sh

      - name: Проверка повторной упаковки при новых датах checkout
        if: steps.source.outputs.binary == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: sh .github/scripts/package-reproducibility.sh

      - name: Установка, обновление и удаление в одноразовом Debian-контейнере
        if: steps.source.outputs.binary == 'true'
        env:
          DEB_VERSION: ${{ steps.version.outputs.deb_version }}
        run: sh .github/scripts/package-lifecycle.sh --disposable-ci "dist/gost-restreamer_${DEB_VERSION}_amd64.deb"

      - name: Публикация проверенного тега
        if: steps.source.outputs.binary == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          VERSION: ${{ steps.plan.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REUSE: ${{ steps.plan.outputs.reuse }}
        run: |
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.$SERVER_URL/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          git ls-remote --tags --refs origin > "$RUNNER_TEMP/release-tags.current"
          LC_ALL=C sort "$RUNNER_TEMP/release-tags.current" > "$RUNNER_TEMP/release-tags.after"
          if ! cmp -s "$RUNNER_TEMP/release-tags.before" "$RUNNER_TEMP/release-tags.after"; then
            echo 'Удалённые теги изменились после планирования; нужен повторный запуск.' >&2
            exit 1
          fi
          if [ "$REUSE" != true ]; then
            test "$(git rev-parse "refs/tags/$VERSION^{commit}")" = "$MERGE_SHA"
            git push origin "refs/tags/$VERSION:refs/tags/$VERSION"
            published="$(git ls-remote --tags --refs origin "refs/tags/$VERSION")"
            test "$published" = "$(printf '%s\t%s' "$MERGE_SHA" "refs/tags/$VERSION")"
          fi

      - name: Проверка существующего стабильного релиза
        if: steps.source.outputs.binary == 'true' && github.event.pull_request.base.ref == 'main'
        id: release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # Версия v8.0.0.
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').prepare({
              github, context, core, version: process.env.VERSION, commit: process.env.MERGE_SHA,
            });

      - name: Создание Draft Release с проверенными файлами
        if: steps.source.outputs.binary == 'true' && github.event.pull_request.base.ref == 'main' && steps.release.outputs.create == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
          DEB_VERSION: ${{ steps.version.outputs.deb_version }}
          GORELEASER_CURRENT_TAG: ${{ steps.plan.outputs.version }}
        run: goreleaser release --config .goreleaser-publish.yaml --clean --skip=archive,nfpm

      - name: Проверка полного Draft Release
        if: steps.source.outputs.binary == 'true' && github.event.pull_request.base.ref == 'main'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # Версия v8.0.0.
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        with:
          script: |
            await require('./.github/scripts/release.cjs').verify({
              github, context, core, version: process.env.VERSION, commit: process.env.MERGE_SHA,
            });

      - name: Сохранение dev-артефактов
        if: steps.source.outputs.binary == 'true' && github.event.pull_request.base.ref == 'develop'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # Версия v7.0.2.
        with:
          name: gost-restreamer-${{ steps.plan.outputs.version }}-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*-SHA256SUMS
          if-no-files-found: error
          retention-days: 14
